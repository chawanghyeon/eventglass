[package]
name = "eventglass"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Single-process error tracking and application log search"

[[bin]]
name = "eventglass"
path = "src/main.rs"

[features]
default = []
failpoints = []
embed-ui = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
argon2 = "0.5"
aws-config = { version = "=1.11.0", default-features = false, features = ["behavior-version-latest", "credentials-process", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "=1.145.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "rustls"] }
axum = "0.8"
base64 = "0.22"
fs4 = "0.13"
flate2 = "1"
hmac = "0.12"
rand = "0.9"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tantivy = { version = "=0.26.1", features = ["zstd-compression"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
