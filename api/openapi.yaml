openapi: 3.1.0
info:
  title: Eventglass Management API
  version: 0.0.0-g04
  description: Generated-contract source for the bounded Eventglass v1 management and query API.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /livez:
    get:
      operationId: getLiveness
      security: []
      responses:
        "200": {description: Alive, content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}
  /readyz:
    get:
      operationId: getReadiness
      security: []
      responses:
        "200": {description: Ready, content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}
        "503": {$ref: "#/components/responses/Error"}
  /v1/setup:
    get:
      operationId: getSetupState
      security: []
      responses:
        "200": {description: Setup state, content: {application/json: {schema: {$ref: "#/components/schemas/SetupState"}}}}
        "503": {$ref: "#/components/responses/Error"}
    post:
      operationId: createSetup
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SetupRequest"}}}}
      responses:
        "201": {description: First session, headers: {Set-Cookie: {schema: {type: string}}}, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/sessions:
    post:
      operationId: createSession
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/LoginRequest"}}}}
      responses:
        "200": {description: Session, headers: {Set-Cookie: {schema: {type: string}}}, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/session:
    get:
      operationId: getSession
      responses:
        "200": {description: Current session, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "401": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteSession
      parameters: [{$ref: "#/components/parameters/CSRF"}]
      responses:
        "204": {description: Revoked}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /v1/session/password:
    post:
      operationId: updateSessionCredential
      parameters: [{$ref: "#/components/parameters/CSRF"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CredentialChangeRequest"}}}}
      responses:
        "204": {description: Password changed; all sessions revoked}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/projects:
    get:
      operationId: listProjects
      parameters: [{$ref: "#/components/parameters/TenantID"}, {$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Cursor"}]
      responses: {"200": {description: Projects, content: {application/json: {schema: {$ref: "#/components/schemas/ProjectList"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
    post:
      operationId: createProject
      parameters: [{$ref: "#/components/parameters/CSRF"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ProjectCreate"}}}}
      responses: {"201": {description: Project, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /v1/projects/{id}:
    patch:
      operationId: updateProject
      parameters: [{$ref: "#/components/parameters/NumericID"}, {$ref: "#/components/parameters/CSRF"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ProjectPatch"}}}}
      responses: {"200": {description: Project, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /v1/projects/{id}/keys:
    get:
      operationId: listProjectKeys
      parameters: [{$ref: "#/components/parameters/NumericID"}, {$ref: "#/components/parameters/TenantID"}]
      responses: {"200": {description: Keys, content: {application/json: {schema: {$ref: "#/components/schemas/KeyList"}}}}, "403": {$ref: "#/components/responses/Error"}}
    post:
      operationId: createProjectKey
      parameters: [{$ref: "#/components/parameters/NumericID"}, {$ref: "#/components/parameters/CSRF"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/KeyCreate"}}}}
      responses: {"201": {description: One-time key secret, content: {application/json: {schema: {$ref: "#/components/schemas/CreatedKey"}}}}, "403": {$ref: "#/components/responses/Error"}}
  /v1/projects/{id}/keys/{key_id}:
    delete:
      operationId: revokeProjectKey
      parameters: [{$ref: "#/components/parameters/NumericID"}, {name: key_id, in: path, required: true, schema: {$ref: "#/components/schemas/UUID"}}, {$ref: "#/components/parameters/TenantID"}, {$ref: "#/components/parameters/Revision"}, {$ref: "#/components/parameters/CSRF"}]
      responses: {"204": {description: Revoked}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /v1/users:
    get:
      operationId: listUsers
      parameters: [{$ref: "#/components/parameters/TenantID"}, {$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Cursor"}]
      responses: {"200": {description: Users, content: {application/json: {schema: {$ref: "#/components/schemas/UserList"}}}}, "403": {$ref: "#/components/responses/Error"}}
    post:
      operationId: createUser
      parameters: [{$ref: "#/components/parameters/CSRF"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UserCreate"}}}}
      responses: {"201": {description: User, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /v1/users/{id}:
    patch:
      operationId: updateUser
      parameters: [{$ref: "#/components/parameters/NumericID"}, {$ref: "#/components/parameters/CSRF"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UserPatch"}}}}
      responses: {"200": {description: User, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /v1/search:
    post:
      operationId: searchRecords
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SearchRequest"}}}}
      responses: {"200": {description: Search result, content: {application/json: {schema: {$ref: "#/components/schemas/SearchResult"}}}}, "202": {description: Async query, content: {application/json: {schema: {$ref: "#/components/schemas/QueryJob"}}}}, "403": {$ref: "#/components/responses/Error"}, "422": {$ref: "#/components/responses/Error"}}
  /v1/aggregate:
    post:
      operationId: aggregateRecords
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AggregateRequest"}}}}
      responses: {"200": {description: Aggregate result, content: {application/json: {schema: {$ref: "#/components/schemas/AggregateResult"}}}}, "202": {description: Async query, content: {application/json: {schema: {$ref: "#/components/schemas/QueryJob"}}}}, "403": {$ref: "#/components/responses/Error"}, "422": {$ref: "#/components/responses/Error"}}
  /v1/records/{id}:
    get:
      operationId: getRecord
      parameters: [{$ref: "#/components/parameters/RecordID"}, {$ref: "#/components/parameters/TenantID"}, {$ref: "#/components/parameters/ProjectID"}, {$ref: "#/components/parameters/ReadToken"}]
      responses: {"200": {description: Record detail, content: {application/json: {schema: {$ref: "#/components/schemas/RecordDetail"}}}}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "410": {$ref: "#/components/responses/Error"}}
  /v1/records/{id}/related:
    post:
      operationId: getRelatedRecords
      parameters: [{$ref: "#/components/parameters/RecordID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RelatedRequest"}}}}
      responses: {"200": {description: Related rows, content: {application/json: {schema: {$ref: "#/components/schemas/SearchResult"}}}}, "403": {$ref: "#/components/responses/Error"}}
  /v1/live:
    get:
      operationId: getLiveRecords
      parameters: [{$ref: "#/components/parameters/TenantID"}, {name: project_ids, in: query, required: true, schema: {type: array, items: {$ref: "#/components/schemas/Int64"}}}, {name: kinds, in: query, schema: {type: array, items: {$ref: "#/components/schemas/Kind"}}}, {name: expression, in: query, schema: {type: string, maxLength: 8192}}, {name: catchup_start_us, in: query, schema: {$ref: "#/components/schemas/Int64"}}, {name: resume_token, in: query, schema: {type: string, maxLength: 8192}}]
      responses: {"200": {description: SSE stream, content: {text/event-stream: {schema: {type: string}}}}, "403": {$ref: "#/components/responses/Error"}}
  /v1/issues:
    get:
      operationId: listIssues
      parameters: [{$ref: "#/components/parameters/TenantID"}, {name: project_ids, in: query, required: true, schema: {type: array, items: {$ref: "#/components/schemas/Int64"}}}, {name: status, in: query, schema: {$ref: "#/components/schemas/IssueStatus"}}, {$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Cursor"}]
      responses: {"200": {description: Issues, content: {application/json: {schema: {$ref: "#/components/schemas/IssueList"}}}}, "403": {$ref: "#/components/responses/Error"}}
  /v1/issues/{id}:
    get:
      operationId: getIssue
      parameters: [{$ref: "#/components/parameters/IssueID"}, {$ref: "#/components/parameters/TenantID"}, {$ref: "#/components/parameters/ProjectID"}]
      responses: {"200": {description: Issue, content: {application/json: {schema: {$ref: "#/components/schemas/Issue"}}}}, "404": {$ref: "#/components/responses/Error"}}
    patch:
      operationId: updateIssue
      parameters: [{$ref: "#/components/parameters/IssueID"}, {$ref: "#/components/parameters/CSRF"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/IssuePatch"}}}}
      responses: {"200": {description: Issue, content: {application/json: {schema: {$ref: "#/components/schemas/Issue"}}}}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /v1/issues/{id}/occurrences:
    get:
      operationId: listIssueOccurrences
      parameters: [{$ref: "#/components/parameters/IssueID"}, {$ref: "#/components/parameters/TenantID"}, {$ref: "#/components/parameters/ProjectID"}, {$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Cursor"}]
      responses: {"200": {description: Occurrences, content: {application/json: {schema: {$ref: "#/components/schemas/OccurrenceList"}}}}, "403": {$ref: "#/components/responses/Error"}}
  /v1/destinations:
    get:
      operationId: listDestinations
      parameters: [{$ref: "#/components/parameters/TenantID"}]
      responses: {"200": {description: Destinations, content: {application/json: {schema: {$ref: "#/components/schemas/DestinationList"}}}}, "403": {$ref: "#/components/responses/Error"}}
    post:
      operationId: createDestination
      parameters: [{$ref: "#/components/parameters/CSRF"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DestinationCreate"}}}}
      responses: {"201": {description: Destination, content: {application/json: {schema: {$ref: "#/components/schemas/Destination"}}}}, "403": {$ref: "#/components/responses/Error"}}
  /v1/destinations/{id}:
    patch:
      operationId: updateDestination
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/CSRF"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DestinationPatch"}}}}
      responses: {"200": {description: Destination, content: {application/json: {schema: {$ref: "#/components/schemas/Destination"}}}}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /v1/alerts:
    get:
      operationId: listAlerts
      parameters: [{$ref: "#/components/parameters/TenantID"}, {$ref: "#/components/parameters/ProjectID"}, {$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Cursor"}]
      responses: {"200": {description: Alert rules, content: {application/json: {schema: {$ref: "#/components/schemas/RuleList"}}}}, "403": {$ref: "#/components/responses/Error"}}
    post:
      operationId: createAlert
      parameters: [{$ref: "#/components/parameters/CSRF"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RuleCreate"}}}}
      responses: {"201": {description: Alert rule, content: {application/json: {schema: {$ref: "#/components/schemas/Rule"}}}}, "403": {$ref: "#/components/responses/Error"}}
  /v1/alerts/{id}:
    patch:
      operationId: updateAlert
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/CSRF"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RulePatch"}}}}
      responses: {"200": {description: Alert rule, content: {application/json: {schema: {$ref: "#/components/schemas/Rule"}}}}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /v1/deliveries:
    get:
      operationId: listDeliveries
      parameters: [{$ref: "#/components/parameters/TenantID"}, {$ref: "#/components/parameters/ProjectID"}, {name: alert_id, in: query, schema: {$ref: "#/components/schemas/UUID"}}, {name: state, in: query, schema: {type: string}}, {$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Cursor"}]
      responses: {"200": {description: Deliveries, content: {application/json: {schema: {$ref: "#/components/schemas/DeliveryList"}}}}, "403": {$ref: "#/components/responses/Error"}}
  /v1/deliveries/{id}/retry:
    post:
      operationId: retryDelivery
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/CSRF"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ScopedRevision"}}}}
      responses: {"200": {description: Delivery, content: {application/json: {schema: {$ref: "#/components/schemas/Delivery"}}}}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /v1/query-jobs/{id}:
    get:
      operationId: getQueryJob
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/TenantID"}]
      responses: {"200": {description: Query job, content: {application/json: {schema: {$ref: "#/components/schemas/QueryJob"}}}}, "404": {$ref: "#/components/responses/Error"}, "410": {$ref: "#/components/responses/Error"}}
    delete:
      operationId: deleteQueryJob
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/TenantID"}, {$ref: "#/components/parameters/CSRF"}]
      responses: {"204": {description: Canceled}, "404": {$ref: "#/components/responses/Error"}}
  /v1/snapshots/{id}/heartbeat:
    post:
      operationId: heartbeatSnapshot
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/CSRF"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SnapshotHeartbeat"}}}}
      responses: {"200": {description: Renewed token, content: {application/json: {schema: {$ref: "#/components/schemas/ReadTokenResponse"}}}}, "403": {$ref: "#/components/responses/Error"}, "410": {$ref: "#/components/responses/Error"}}
  /v1/snapshots/{id}:
    delete:
      operationId: deleteSnapshot
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/TenantID"}, {$ref: "#/components/parameters/CSRF"}]
      responses: {"204": {description: Released}, "404": {$ref: "#/components/responses/Error"}}
  /v1/system:
    get:
      operationId: getSystem
      parameters: [{$ref: "#/components/parameters/TenantID"}]
      responses: {"200": {description: System state, content: {application/json: {schema: {$ref: "#/components/schemas/System"}}}}, "403": {$ref: "#/components/responses/Error"}}
  /v1/system/retention:
    patch:
      operationId: updateRetention
      parameters: [{$ref: "#/components/parameters/CSRF"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RetentionPatch"}}}}
      responses: {"200": {description: Retention, content: {application/json: {schema: {$ref: "#/components/schemas/Retention"}}}}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /v1/system/sdk-outcomes:
    get:
      operationId: listSDKOutcomes
      parameters: [{$ref: "#/components/parameters/TenantID"}, {name: start_us, in: query, required: true, schema: {$ref: "#/components/schemas/Int64"}}, {name: end_us, in: query, required: true, schema: {$ref: "#/components/schemas/Int64"}}, {$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Cursor"}]
      responses: {"200": {description: SDK outcomes, content: {application/json: {schema: {$ref: "#/components/schemas/SDKOutcomeList"}}}}, "403": {$ref: "#/components/responses/Error"}}
  /v1/audit:
    get:
      operationId: listAudit
      parameters: [{$ref: "#/components/parameters/TenantID"}, {$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Cursor"}]
      responses: {"200": {description: Audit events, content: {application/json: {schema: {$ref: "#/components/schemas/AuditList"}}}}, "403": {$ref: "#/components/responses/Error"}}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: __Host-eventglass_session}
  parameters:
    CSRF: {name: X-CSRF-Token, in: header, required: true, schema: {type: string, minLength: 43, maxLength: 43}}
    ID: {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/UUID"}}
    NumericID: {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/Int64"}}
    RecordID: {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/SHA256"}}
    IssueID: {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/SHA256"}}
    TenantID: {name: tenant_id, in: query, required: true, schema: {$ref: "#/components/schemas/Int64"}}
    ProjectID: {name: project_id, in: query, required: true, schema: {$ref: "#/components/schemas/Int64"}}
    Revision: {name: revision, in: query, required: true, schema: {$ref: "#/components/schemas/Int64"}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 8192}}
    ReadToken: {name: read_token, in: query, schema: {type: string, maxLength: 8192}}
  responses:
    Error: {description: Error, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  schemas:
    UUID: {type: string, format: uuid, pattern: "^[0-9a-f-]{36}$"}
    SHA256: {type: string, pattern: "^[0-9a-f]{64}$"}
    Int64: {type: string, pattern: "^-?(0|[1-9][0-9]*)$"}
    Timestamp: {type: string, format: date-time}
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties: {status: {type: string, enum: [alive, ready]}}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable, request_id]
      properties:
        code: {type: string, maxLength: 64}
        message: {type: string, maxLength: 512}
        retryable: {type: boolean}
        request_id: {$ref: "#/components/schemas/UUID"}
        details: {type: object, additionalProperties: true}
    SetupState:
      type: object
      additionalProperties: false
      required: [state]
      properties: {state: {type: string, enum: [required, in_progress, complete]}}
    SetupRequest:
      type: object
      additionalProperties: false
      required: [bootstrap_token, email, password, tenant_name]
      properties:
        bootstrap_token: {type: string, pattern: "^[0-9a-f]{64}$"}
        email: {type: string, minLength: 3, maxLength: 320}
        password: {type: string, minLength: 12, maxLength: 1024}
        tenant_name: {type: string, minLength: 1, maxLength: 128}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties: {email: {type: string, minLength: 3, maxLength: 320}, password: {type: string, maxLength: 1024}}
    CredentialChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties: {current_password: {type: string, maxLength: 1024}, new_password: {type: string, minLength: 12, maxLength: 1024}}
    ProjectGrant:
      type: object
      additionalProperties: false
      required: [project_id, role]
      properties: {project_id: {$ref: "#/components/schemas/Int64"}, role: {type: string, enum: [operator, viewer]}}
    SessionTenant:
      type: object
      additionalProperties: false
      required: [tenant_id, name, role, project_grants]
      properties:
        tenant_id: {$ref: "#/components/schemas/Int64"}
        name: {type: string}
        role: {type: string, enum: [admin, member]}
        project_grants: {type: array, items: {$ref: "#/components/schemas/ProjectGrant"}}
    Session:
      type: object
      additionalProperties: false
      required: [user_id, email, tenants, expires_at, csrf_token, is_installation_admin]
      properties:
        user_id: {$ref: "#/components/schemas/Int64"}
        email: {type: string}
        tenants: {type: array, items: {$ref: "#/components/schemas/SessionTenant"}}
        expires_at: {$ref: "#/components/schemas/Timestamp"}
        csrf_token: {type: string, minLength: 43, maxLength: 43}
        is_installation_admin: {type: boolean}
    ScrubRules:
      type: object
      additionalProperties: false
      required: [version, redact_keys, redact_paths, body_patterns]
      properties:
        version: {type: integer, const: 1}
        redact_keys: {type: array, maxItems: 32, items: {type: string, maxLength: 128}}
        redact_paths: {type: array, maxItems: 32, items: {type: string, maxLength: 1024}}
        body_patterns: {type: array, maxItems: 32, items: {type: string, maxLength: 1024}}
    Project:
      type: object
      additionalProperties: false
      required: [tenant_id, project_id, name, state, default_service, allowed_origins, revision, auth_revision, scrub_revision]
      properties:
        tenant_id: {$ref: "#/components/schemas/Int64"}
        project_id: {$ref: "#/components/schemas/Int64"}
        name: {type: string}
        state: {type: string, enum: [active, disabled]}
        default_service: {type: string}
        allowed_origins: {type: array, items: {type: string, format: uri}}
        revision: {$ref: "#/components/schemas/Int64"}
        auth_revision: {$ref: "#/components/schemas/Int64"}
        scrub_revision: {$ref: "#/components/schemas/Int64"}
        scrub_rules: {$ref: "#/components/schemas/ScrubRules"}
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, name, default_service, allowed_origins]
      properties: {tenant_id: {$ref: "#/components/schemas/Int64"}, name: {type: string}, default_service: {type: string}, allowed_origins: {type: array, items: {type: string, format: uri}}}
    ProjectPatch:
      type: object
      additionalProperties: false
      required: [tenant_id, revision]
      properties: {tenant_id: {$ref: "#/components/schemas/Int64"}, revision: {$ref: "#/components/schemas/Int64"}, name: {type: string}, state: {type: string, enum: [active, disabled]}, default_service: {type: string}, allowed_origins: {type: array, items: {type: string, format: uri}}, scrub_rules: {$ref: "#/components/schemas/ScrubRules"}}
    ProjectList: {$ref: "#/components/schemas/GenericProjectList"}
    GenericProjectList:
      type: object
      required: [items, next_cursor]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Project"}}, next_cursor: {type: string, nullable: true}}
    Key:
      type: object
      required: [key_id, label, key_prefix, state, revision, created_at]
      properties: {key_id: {$ref: "#/components/schemas/UUID"}, label: {type: string}, key_prefix: {type: string, pattern: "^[0-9a-f]{8}$"}, state: {type: string, enum: [active, revoked]}, revision: {$ref: "#/components/schemas/Int64"}, created_at: {$ref: "#/components/schemas/Timestamp"}}
    CreatedKey:
      allOf:
        - {$ref: "#/components/schemas/Key"}
