components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: eventglass_session
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]+$"
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]+$"
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]+$"
    IssueId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IssueId"
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SetupRequest:
      type: object
      additionalProperties: false
      required: [token, email, password]
      properties:
        token:
          type: string
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 128
    LoginResponse:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
    Session:
      type: object
      additionalProperties: false
      required: [id, email, role, csrf_token]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, member]
        csrf_token:
          type: string
    User:
      type: object
      additionalProperties: false
      required: [id, email, role, is_active]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, member]
        is_active:
          type: boolean
    UserList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
    CreateUserInput:
      type: object
      additionalProperties: false
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
        role:
          type: string
          enum: [admin, member]
    UpdateUserInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          type: string
          enum: [admin, member]
        is_active:
          type: boolean
    Project:
      type: object
      additionalProperties: false
      required: [id, slug, name, is_active]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        is_active:
          type: boolean
    ProjectList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    ProjectInput:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9-]+$"
        name:
          type: string
          minLength: 1
          maxLength: 200
    ProjectUpdate:
      type: object
      additionalProperties: false
      required: [is_active]
      properties:
        is_active:
          type: boolean
    IdResponse:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
    ProjectKey:
      type: object
      additionalProperties: false
      required: [id, public_key, dsn]
      properties:
        id:
          type: string
        public_key:
          type: string
        dsn:
          type: string
          format: uri
    Int64String:
      type: string
      pattern: "^-?[0-9]+$"
      description: Signed 64-bit integer encoded as a decimal string.
    PositiveDecimalString:
      type: string
      pattern: "^[1-9][0-9]*$"
      description: Positive 64-bit integer encoded as a decimal string.
    NonNegativeDecimalString:
      type: string
      pattern: "^[0-9]+$"
      description: Non-negative 64-bit integer encoded as a decimal string.
    IssueId:
      type: string
      pattern: "^[0-9a-f]{64}$"
    IssueStatus:
      type: string
      enum: [unresolved, resolved, ignored]
    Issue:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - fingerprint
        - fingerprint_version
        - title
        - culprit
        - level
        - status
        - first_seen_us
        - last_seen_us
        - occurrence_count
        - first_release
        - last_release
        - resolved_at_us
        - resolved_through_ingest_seq
        - revision
        - created_at_us
        - updated_at_us
      properties:
        id:
          $ref: "#/components/schemas/IssueId"
        project_id:
          $ref: "#/components/schemas/PositiveDecimalString"
        fingerprint:
          type: string
        fingerprint_version:
          $ref: "#/components/schemas/PositiveDecimalString"
        title:
          type: string
        culprit:
          type: [string, "null"]
        level:
          type: string
        status:
          $ref: "#/components/schemas/IssueStatus"
        first_seen_us:
          $ref: "#/components/schemas/Int64String"
        last_seen_us:
          $ref: "#/components/schemas/Int64String"
        occurrence_count:
          $ref: "#/components/schemas/PositiveDecimalString"
        first_release:
          type: [string, "null"]
        last_release:
          type: [string, "null"]
        resolved_at_us:
          oneOf:
            - $ref: "#/components/schemas/Int64String"
            - type: "null"
        resolved_through_ingest_seq:
          oneOf:
            - $ref: "#/components/schemas/NonNegativeDecimalString"
            - type: "null"
        revision:
          $ref: "#/components/schemas/NonNegativeDecimalString"
        created_at_us:
          $ref: "#/components/schemas/Int64String"
        updated_at_us:
          $ref: "#/components/schemas/Int64String"
    IssueCursor:
      type: object
      additionalProperties: false
      required: [last_seen_us, id]
      properties:
        last_seen_us:
          $ref: "#/components/schemas/Int64String"
        id:
          $ref: "#/components/schemas/IssueId"
    IssuePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        next_cursor:
          oneOf:
            - $ref: "#/components/schemas/IssueCursor"
            - type: "null"
    IssueUpdate:
      type: object
      additionalProperties: false
      required: [status, expected_revision]
      properties:
        status:
          $ref: "#/components/schemas/IssueStatus"
        expected_revision:
          $ref: "#/components/schemas/NonNegativeDecimalString"
    Occurrence:
      type: object
      additionalProperties: false
      required: [record_id, source_event_id, ingest_seq, occurred_at_us]
      properties:
        record_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        source_event_id:
          type: [string, "null"]
        ingest_seq:
          $ref: "#/components/schemas/PositiveDecimalString"
        occurred_at_us:
          $ref: "#/components/schemas/Int64String"
    OccurrenceCursor:
      type: object
      additionalProperties: false
      required: [occurred_at_us, ingest_seq]
      properties:
        occurred_at_us:
          $ref: "#/components/schemas/Int64String"
        ingest_seq:
          $ref: "#/components/schemas/PositiveDecimalString"
    OccurrencePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Occurrence"
        next_cursor:
          oneOf:
            - $ref: "#/components/schemas/OccurrenceCursor"
            - type: "null"
    SearchProjectId:
      oneOf:
        - $ref: "#/components/schemas/PositiveDecimalString"
        - type: integer
          format: int64
          minimum: 1
      description: A positive project ID accepted as a decimal string or JSON integer.
    SearchFilters:
      type: object
      additionalProperties: false
      properties:
        kinds:
          type: array
          maxItems: 64
          items:
            type: string
            enum: [log, error]
        services:
          $ref: "#/components/schemas/SearchFilterValues"
        levels:
          $ref: "#/components/schemas/SearchFilterValues"
        environments:
          $ref: "#/components/schemas/SearchFilterValues"
        releases:
          $ref: "#/components/schemas/SearchFilterValues"
        loggers:
          $ref: "#/components/schemas/SearchFilterValues"
    SearchFilterValues:
      type: array
      maxItems: 64
      items:
        type: string
        maxLength: 8192
    SearchRequest:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        projects:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/SearchProjectId"
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        query:
          type: string
          maxLength: 8192
        filters:
          $ref: "#/components/schemas/SearchFilters"
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: Defaults to 100 when omitted.
        cursor:
          type: string
        read_token:
          type: string
    SearchRow:
      type: object
      additionalProperties: false
      required:
        - record_id
        - kind
        - project_id
        - ingest_seq
        - timestamp
        - received_at
        - service
        - level
        - message
        - environment
        - release
        - logger
        - trace_id
        - span_id
        - request_id
        - issue_id
        - fingerprint
        - user_id
        - user_email
        - detail_token
      properties:
        record_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        kind:
          type: string
          enum: [log, error]
        project_id:
          $ref: "#/components/schemas/PositiveDecimalString"
        ingest_seq:
          $ref: "#/components/schemas/PositiveDecimalString"
        timestamp:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        service:
          type: string
        level:
          type: string
        message:
          type: string
        environment:
          type: [string, "null"]
        release:
          type: [string, "null"]
        logger:
          type: [string, "null"]
        trace_id:
          type: [string, "null"]
        span_id:
          type: [string, "null"]
        request_id:
          type: [string, "null"]
        issue_id:
          type: [string, "null"]
        fingerprint:
          type: [string, "null"]
        user_id:
          type: [string, "null"]
        user_email:
          type: [string, "null"]
        detail_token:
          type: string
    SearchPage:
      type: object
      additionalProperties: false
      required:
        - rows
        - next_cursor
        - read_token
        - watermark
        - complete
        - took_ms
        - searched_shards
        - hydrated_shards
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SearchRow"
        next_cursor:
          type: [string, "null"]
        read_token:
          type: string
        watermark:
          $ref: "#/components/schemas/NonNegativeDecimalString"
        complete:
          type: boolean
          const: true
        took_ms:
          $ref: "#/components/schemas/NonNegativeDecimalString"
        searched_shards:
          $ref: "#/components/schemas/NonNegativeDecimalString"
        hydrated_shards:
          $ref: "#/components/schemas/NonNegativeDecimalString"
    RecordDetail:
      type: object
      additionalProperties: false
      required: [record_id, raw]
      properties:
        record_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        raw: {}
        detail_token:
          type: string
    RelatedRecords:
      type: object
      additionalProperties: false
      required:
        - reference_record_id
        - strategy
        - exact
        - window_seconds
        - watermark
        - complete
        - truncated
        - rows
      properties:
        reference_record_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        strategy:
          type: string
          enum:
            - trace_id
            - request_id
            - project_service_user_time
            - project_service_error_time
        exact:
          type: boolean
        window_seconds:
          type: integer
          minimum: 30
          maximum: 86400
        watermark:
          $ref: "#/components/schemas/NonNegativeDecimalString"
        complete:
          type: boolean
          const: true
        truncated:
          type: boolean
        rows:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/SearchRow"
    AlertTimeBasis:
      type: string
      enum: [received_at, timestamp]
    AlertCondition:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              type: string
              const: new_issue
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              type: string
              const: regression
        - type: object
          additionalProperties: false
          required:
            [
              type,
              query,
              window_seconds,
              threshold,
              cooldown_seconds,
              time_basis,
            ]
          properties:
            type:
              type: string
              enum: [error_count, log_count]
            query:
              type: string
              maxLength: 8192
            window_seconds:
              type: integer
              minimum: 60
              maximum: 2592000
            threshold:
              type: integer
              format: uint64
              minimum: 1
            cooldown_seconds:
              type: integer
              minimum: 0
              maximum: 2592000
            time_basis:
              $ref: "#/components/schemas/AlertTimeBasis"
    AlertDestination:
      type: object
      additionalProperties: false
      required: [type, url]
      properties:
        type:
          type: string
          const: webhook
        url:
          type: string
          format: uri
          pattern: "^https://"
    AlertInput:
      type: object
      additionalProperties: false
      required: [name, project_id, condition, destination, enabled]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        project_id:
          oneOf:
            - $ref: "#/components/schemas/PositiveDecimalString"
            - type: "null"
        condition:
          $ref: "#/components/schemas/AlertCondition"
        destination:
          $ref: "#/components/schemas/AlertDestination"
        enabled:
          type: boolean
    AlertUpdate:
      allOf:
        - $ref: "#/components/schemas/AlertInput"
        - type: object
          required: [revision]
          properties:
            revision:
              type: integer
              format: int64
              minimum: 0
    Alert:
      allOf:
        - $ref: "#/components/schemas/AlertInput"
        - type: object
          required:
            - id
            - revision
            - last_evaluation_error
            - last_evaluation_watermark
            - pending_evaluation_end_us
            - pending_cut_seq
            - last_evaluated_at_us
            - last_triggered_at_us
            - created_at_us
            - updated_at_us
          properties:
