openapi: 3.1.0
info:
  title: Eventglass API
  version: 0.1.0
  description: Eventglass setup, session, project, Issue, log search, record detail, and system contracts.
servers:
  - url: /
paths:
  /api/setup:
    post:
      operationId: setup
      summary: Create the first administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Administrator created
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/auth/login:
    post:
      operationId: login
      summary: Start an administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Session started
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/auth/me:
    get:
      operationId: getSession
      summary: Read the active session
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/auth/logout:
    post:
      operationId: logout
      summary: End the active session
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Session ended
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/users:
    get:
      operationId: listUsers
      summary: List users as an administrator
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: Create a user as an administrator
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/users/{id}:
    patch:
      operationId: updateUser
      summary: Change a user's role or active state
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "204":
          description: User updated
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/projects:
    get:
      operationId: listProjects
      summary: List projects visible to the active principal
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Visible projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      operationId: createProject
      summary: Create a project
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/projects/{id}:
    patch:
      operationId: updateProject
      summary: Activate or deactivate a project
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "204":
          description: Project updated
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/projects/{id}/keys:
    get:
      operationId: listProjectKeys
      summary: List active SDK keys and DSNs (administrator only)
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Active project keys
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectKey"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: createProjectKey
      summary: Issue a project DSN key
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "201":
          description: Issued key and DSN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectKey"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/projects/{id}/keys/{key_id}:
    delete:
      operationId: revokeProjectKey
      summary: Revoke a project key
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/KeyId"
      responses:
        "204":
          description: Key revoked
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/issues:
    get:
      operationId: listIssues
      summary: List Issues for an active project
      security:
        - cookieAuth: []
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PositiveDecimalString"
        - name: query
          in: query
          description: Literal title substring. ASCII case-insensitive; percent and underscore are literal characters.
          schema:
            type: string
            maxLength: 256
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/IssueStatus"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor_last_seen_us
          in: query
          description: Must be paired with cursor_id.
          schema:
            $ref: "#/components/schemas/Int64String"
        - name: cursor_id
          in: query
          description: Must be paired with cursor_last_seen_us.
          schema:
            $ref: "#/components/schemas/IssueId"
      responses:
        "200":
          description: Stable page ordered by last seen descending and Issue ID ascending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuePage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/issues/{id}:
    get:
      operationId: getIssue
      summary: Read scrubbed mutable Issue metadata
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IssueId"
      responses:
        "200":
          description: Issue metadata without raw occurrence payloads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateIssue
      summary: Change Issue status with revision compare-and-swap
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueUpdate"
      responses:
        "200":
          description: Updated Issue metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/issues/{id}/events:
    get:
      operationId: listIssueOccurrences
      summary: List occurrence identities without raw payload hydration
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IssueId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor_occurred_at_us
          in: query
          description: Must be paired with cursor_ingest_seq.
          schema:
            $ref: "#/components/schemas/Int64String"
        - name: cursor_ingest_seq
          in: query
          description: Must be paired with cursor_occurred_at_us.
          schema:
            $ref: "#/components/schemas/PositiveDecimalString"
      responses:
        "200":
          description: Stable page ordered by occurrence time and ingest sequence descending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrencePage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/issues/{id}/events/{record_id}:
    get:
      operationId: getIssueOccurrence
      summary: Hydrate the scrubbed payload for one Issue occurrence
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IssueId"
        - name: record_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: Normalized and scrubbed stored occurrence payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordDetail"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
  /api/logs:
    get:
      operationId: listLogs
      summary: Search projected log and error rows in a stable read snapshot
      security:
        - cookieAuth: []
      parameters:
        - name: projects
          in: query
          description: Comma-separated positive decimal project IDs. Omitted means all active projects visible to the principal.
          schema:
            type: string
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: query
          in: query
          schema:
            type: string
            maxLength: 8192
        - name: filters
          in: query
          description: JSON-encoded SearchFilters object.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
        - name: read_token
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Rows ordered by timestamp and ingest sequence descending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
  /api/logs/live:
    get:
      operationId: streamLogs
      summary: Stream received records in ingest sequence order
      description: |
        Uses a fixed absolute received-time scope. Each record and completed scan
        checkpoint carries a signed SSE id. Reconnect with Last-Event-ID or the
        equivalent resume query parameter.
      security:
        - cookieAuth: []
      parameters:
        - name: projects
          in: query
          description: Comma-separated positive decimal project IDs. Omitted means all active projects visible to the principal.
          schema:
            type: string
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: query
          in: query
          schema:
            type: string
            maxLength: 8192
        - name: filters
          in: query
          description: JSON-encoded SearchFilters object.
          schema:
            type: string
        - name: resume
          in: query
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: SSE record, checkpoint, resync_required, and error events
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/explore/search:
    post:
      operationId: searchLogs
      summary: Search projected log and error rows with a JSON request
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Rows ordered by timestamp and ingest sequence descending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
  /api/records/{detail_token}:
    get:
      operationId: getRecord
      summary: Hydrate one scrubbed stored payload using its opaque detail token
      security:
        - cookieAuth: []
      parameters:
        - name: detail_token
          in: path
          required: true
          schema:
            type: string
            maxLength: 12288
      responses:
        "200":
          description: Normalized and scrubbed stored payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordDetail"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
  /api/records/{detail_token}/related:
    get:
      operationId: getRelatedRecords
      summary: Find authorized records related to one signed record identity
      security:
        - cookieAuth: []
      parameters:
        - name: detail_token
          in: path
          required: true
          schema:
            type: string
            maxLength: 12288
        - name: window_seconds
          in: query
          schema:
            type: integer
            minimum: 30
            maximum: 86400
            default: 3600
      responses:
        "200":
          description: Related records and the correlation strategy actually used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedRecords"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
  /api/alerts:
    get:
      operationId: listAlerts
      summary: List active alert configurations
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Alert configurations visible to an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      operationId: createAlert
      summary: Create an alert configuration
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertInput"
      responses:
        "201":
          description: Alert created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/alerts/{id}:
    patch:
      operationId: updateAlert
      summary: Replace an alert configuration using revision compare-and-swap
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertUpdate"
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAlert
      summary: Soft-delete an alert and cancel pending deliveries
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: revision
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "204":
          description: Alert deleted
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/alert-deliveries:
    get:
      operationId: listAlertDeliveries
      summary: Inspect recent alert delivery outcomes
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Recent deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertDeliveryList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/alert-deliveries/{id}/retry:
    post:
      operationId: retryAlertDelivery
      summary: Retry one failed delivery with its stable identity
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "204":
          description: Delivery queued with the same ID
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/system/status:
    get:
      operationId: getSystemStatus
      summary: Read implementation and readiness status
      security:
        - cookieAuth: []
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/system/efficiency:
    get:
      operationId: getSystemEfficiency
      summary: Read bounded observations since this process started (excluding startup restore)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logical operations and completed read bytes; SDK retries and partial bodies are not measured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EfficiencySnapshot"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
