minimum_pre_commit_version: 4.6.2
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: text-hygiene
        name: merge markers, EOF, and trailing whitespace
        entry: .tools/quality/bin/python scripts/hooks/check-text.py
        language: system
        types: [text]
        exclude: '^vendor/'
        stages: [pre-commit]
      - id: structured-syntax
        name: YAML, TOML, and JSON syntax
        entry: .tools/quality/bin/python scripts/hooks/check-syntax.py
        language: system
        types_or: [json, toml, yaml]
        exclude: '^vendor/'
        stages: [pre-commit]
      - id: secrets
        name: detect secrets
        entry: .tools/quality/bin/python scripts/hooks/check-secrets.py
        language: system
        types: [text]
        exclude: '^vendor/'
        stages: [pre-commit]
      - id: gofmt
        name: Go formatting
        entry: scripts/hooks/check-gofmt
        language: system
        types: [go]
        stages: [pre-commit]
      - id: workflow-lint
        name: GitHub workflow lint
        entry: scripts/hooks/check-workflows
        language: system
        files: '^\.github/workflows/.*\.ya?ml$'
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]
      - id: pre-push-go
        name: Go unit and layout contracts
        entry: ./scripts/check unit
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
