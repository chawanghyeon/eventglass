name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: required
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/quality.txt
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          cache-bin: 'false'
      - name: Install pinned repository tools and dependencies
        run: |
          ./scripts/install-ci-tools
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          PATH="$GITHUB_WORKSPACE/.tools/bin:$PATH" ./scripts/bootstrap
      - name: Run lightweight required checks
        run: |
          ./scripts/check quick
          ./scripts/check web
          ./scripts/check rust
          ./scripts/check contracts
          ./scripts/check integration
          ./scripts/check crash-smoke
      - name: Verify checks did not change tracked files
        run: git diff --exit-code
