[eventglass]
pg1-path=/var/lib/postgresql/data

[global]
archive-async=n
process-max=2
repo1-bundle=y
repo1-path=/eventglass-pgbackrest
repo1-retention-full=2
repo1-s3-bucket=eventglass-backup
repo1-s3-endpoint=minio
repo1-s3-region=us-east-1
repo1-s3-uri-style=path
repo1-storage-host=minio
repo1-storage-port=9000
repo1-storage-verify-tls=n
repo1-type=s3
start-fast=y

[global:archive-push]
compress-level=3
